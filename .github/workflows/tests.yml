name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: proyecto-demo
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Ejecutar pruebas
        run: python -B -m unittest discover -s tests -v

  login-tests:
    name: Login / 5 tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: login-app
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v6
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - name: Instalar Flask
        run: python -m pip install -r requirements.txt
      - name: Ejecutar los 5 tests del login
        run: python -B -m unittest discover -s tests -v
